<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<script>
			// Apply the saved theme before first paint to avoid a flash of the default.
			try {
				var s = JSON.parse(localStorage.getItem('patience:settings'));
				if (s && s.theme) document.documentElement.dataset.theme = s.theme;
				document.documentElement.dataset.face = (s && s.face) || 'cozy';
			} catch (e) {
				document.documentElement.dataset.face = 'cozy';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
