<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover is required for env(safe-area-inset-*) to be non-zero
		     on notched iPhones (esp. in full-screen standalone mode). -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="text-scale" content="scale" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="canonical" href="https://patience.maxbromberg.me/" />

		<!-- PWA: installable, offline-capable, full-screen on the home screen. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		<!-- iOS needs a raster apple-touch-icon (it ignores SVG for Add to Home Screen). -->
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Patience" />

		<!-- SEO / social defaults (per-page <svelte:head> overrides title + description) -->
		<meta
			name="description"
			content="Patience — a cozy, free collection of single-player solitaire and trick-taking card games you can play in your browser, with AI opponents. No ads, no sign-up."
		/>
		<meta name="theme-color" content="#1f5e40" />
		<meta name="author" content="Max Bromberg" />
		<meta
			name="keywords"
			content="solitaire, card games, klondike, freecell, spider, euchre, hearts, free online card games, AI card games"
		/>

		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Patience" />
		<meta property="og:title" content="Patience · cozy card games" />
		<meta
			property="og:description"
			content="A cozy, free collection of solitaire and trick-taking card games with AI opponents — playable right in your browser."
		/>
		<meta property="og:url" content="https://patience.maxbromberg.me/" />
		<meta property="og:image" content="https://patience.maxbromberg.me/favicon.svg" />

		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Patience · cozy card games" />
		<meta
			name="twitter:description"
			content="A cozy, free collection of solitaire and trick-taking card games with AI opponents."
		/>
		<meta name="twitter:image" content="https://patience.maxbromberg.me/favicon.svg" />

		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Patience",
				"url": "https://patience.maxbromberg.me/",
				"applicationCategory": "GameApplication",
				"operatingSystem": "Any",
				"browserRequirements": "Requires a modern web browser",
				"description": "A cozy collection of single-player solitaire and trick-taking card games with AI opponents.",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
			}
		</script>

		<script>
			// Apply the saved theme before first paint to avoid a flash of the default.
			try {
				var s = JSON.parse(localStorage.getItem('patience:settings'));
				if (s && s.theme) document.documentElement.dataset.theme = s.theme;
				document.documentElement.dataset.face = (s && s.face) || 'cozy';

				// iOS reads the status-bar style only at launch, so pick it here from
				// the saved theme: dark text (opaque bar) on light themes, light text
				// (immersive translucent bar) on dark ones. Kept in sync with
				// isLightTheme() in $lib/theme/themes.
				var light = { cloudtop: 1, buttercream: 1 };
				var isLight = false;
				if (s && s.theme === 'custom' && s.custom && s.custom.felt) {
					var h = String(s.custom.felt).replace('#', '');
					if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
					var r = parseInt(h.slice(0, 2), 16);
					var g = parseInt(h.slice(2, 4), 16);
					var b = parseInt(h.slice(4, 6), 16);
					isLight = (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.65;
				} else if (s && s.theme) {
					isLight = !!light[s.theme];
				}
				var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
				if (sb) sb.setAttribute('content', isLight ? 'default' : 'black-translucent');
			} catch (e) {
				document.documentElement.dataset.face = 'cozy';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
