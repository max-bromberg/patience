<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<style>
			html,
			body {
				margin: 0;
				padding: 0;
				width: 100%;
				height: 100%;
				overflow: hidden;
			}
			.bg {
				width: 100vw;
				height: 100vh;
				display: grid;
				place-items: center;
				/* Felt-table green, matching the app (theme.css). */
				background: radial-gradient(130% 130% at 50% 6%, #34875e, #1f5e40 52%, #184a32);
			}
			/* A big, plump, cute heart — the star of the icon. */
			.heart {
				width: var(--heart, 74%);
				filter: drop-shadow(0 3.5vw 4vw rgba(0, 0, 0, 0.32));
			}
			.spark {
				fill: #fff;
			}
		</style>
	</head>
	<body>
		<div class="bg">
			<svg class="heart" viewBox="0 0 100 96" aria-hidden="true">
				<defs>
					<radialGradient id="h" cx="38%" cy="28%" r="80%">
						<stop offset="0%" stop-color="#ff8aa0" />
						<stop offset="52%" stop-color="#e64d69" />
						<stop offset="100%" stop-color="#c8324a" />
					</radialGradient>
				</defs>
				<!-- plump kawaii heart -->
				<path
					d="M50 90 C 18 66, 3 47, 3 28 C 3 13.5, 14.5 3, 28 3 C 39 3, 46 11, 50 19.5 C 54 11, 61 3, 72 3 C 85.5 3, 97 13.5, 97 28 C 97 47, 82 66, 50 90 Z"
					fill="url(#h)"
				/>
				<!-- glossy highlight for the cute look -->
				<ellipse
					cx="34"
					cy="27"
					rx="13"
					ry="9"
					fill="#fff"
					opacity="0.5"
					transform="rotate(-24 34 27)"
				/>
				<circle cx="60" cy="24" r="3.4" fill="#fff" opacity="0.35" />
				<!-- little sparkle -->
				<path
					class="spark"
					opacity="0.9"
					d="M80 15 l1.6 4.2 l4.2 1.6 l-4.2 1.6 l-1.6 4.2 l-1.6 -4.2 l-4.2 -1.6 l4.2 -1.6 Z"
				/>
			</svg>
		</div>
		<script>
			// ?heart=NN% sets the heart size (smaller for the maskable safe zone).
			const p = new URLSearchParams(location.search).get('heart');
			if (p) document.querySelector('.heart').style.setProperty('--heart', p);
		</script>
	</body>
</html>
